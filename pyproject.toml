[project]
name = "podcast-practice"
version = "0.1.0"
description = "Local podcast listening practice with Montreal Forced Aligner"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "faster-whisper==1.2.1",
  "filelock>=3.16,<5",
  "num2words==0.5.14",
  "praatio==6.2.2",
]

[project.scripts]
podcast-practice = "podcast_practice.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_practice"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".runtime", ".venv", "library", "inbox"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
